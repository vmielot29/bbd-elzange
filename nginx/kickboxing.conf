## ============================================================================
## BBD Elzange — Configuration Nginx
## Déploiement statique pur — pas de Node.js nécessaire en production.
## Place ce fichier dans : /etc/nginx/sites-available/kickboxing
## Puis : ln -s /etc/nginx/sites-available/kickboxing /etc/nginx/sites-enabled/
## ============================================================================

# Redirection HTTP → HTTPS (sera ajoutée automatiquement par Certbot,
# mais voici le bloc explicite si tu préfères le gérer toi-même)
server {
    listen 80;
    listen [::]:80;
    # TODO: remplace par ton domaine réel
    server_name bbd-elzange.fr www.bbd-elzange.fr;

    # Bloc HTTP-only utilisé pour la validation Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste : redirection vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Bloc HTTPS principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # TODO: remplace par ton domaine réel
    server_name bbd-elzange.fr www.bbd-elzange.fr;

    # ========================================================================
    # Certificats — gérés par Certbot, paths réels écrits par lui après
    # `sudo certbot --nginx -d bbd-elzange.fr -d www.bbd-elzange.fr`
    # ========================================================================
    ssl_certificate     /etc/letsencrypt/live/bbd-elzange.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bbd-elzange.fr/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/bbd-elzange.fr/chain.pem;

    # SSL hardening (recommandations Mozilla intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # ========================================================================
    # Racine documentaire
    # ========================================================================
    root /var/www/kickboxing;
    index index.html;

    # Charset
    charset utf-8;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml application/xml application/xml+rss
        text/javascript application/javascript application/json
        application/manifest+json image/svg+xml font/ttf font/otf font/eot;

    # ========================================================================
    # Sécurité — headers HTTP
    # ========================================================================
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS — n'active qu'après avoir validé HTTPS sur tous les sous-domaines
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ========================================================================
    # Routing SPA — try_files vers index.html
    # ========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ========================================================================
    # Cache long pour les assets immuables (fingerprintés par le build Angular)
    # ========================================================================
    location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # robots.txt et sitemap.xml — pas de cache long, on veut pouvoir les modifier
    location = /robots.txt  { expires 1d; access_log off; }
    location = /sitemap.xml { expires 1d; access_log off; }

    # ========================================================================
    # Sécurité supplémentaire — refuse les fichiers cachés et de configuration
    # ========================================================================
    location ~ /\.(?!well-known) { deny all; }

    # Pas de log pour favicon manquant
    location = /favicon.ico { log_not_found off; access_log off; }

    # Limite du body d'upload (formulaire Formspree → externe, pas d'upload local)
    client_max_body_size 1m;
}
